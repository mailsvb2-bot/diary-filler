name: Windows Live E2E Core

on:
  workflow_call:
    inputs:
      target_os:
        description: Expected client Windows generation
        required: true
        type: string
      runner_label:
        description: Dedicated interactive self-hosted runner label
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-e2e:
    # This reusable job is intentionally self-hosted. The thin Windows 10/11
    # callers gate execution to main and select a dedicated interactive runner.
    runs-on:
      - self-hosted
      - Windows
      - X64
      - diary-filler-live-e2e
      - ${{ inputs.runner_label }}
    timeout-minutes: 120

    steps:
      - name: Refuse untrusted live E2E target
        shell: powershell
        run: |
          if ("${{ github.repository }}" -ne "mailsvb2-bot/diary-filler") {
            throw "Unexpected repository identity."
          }
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Live E2E may execute only from refs/heads/main."
          }
          $target = "${{ inputs.target_os }}"
          $label = "${{ inputs.runner_label }}"
          $allowed = @{
            "windows10" = "windows10-interactive"
            "windows11" = "windows11-interactive"
          }
          if (-not $allowed.ContainsKey($target) -or $allowed[$target] -ne $label) {
            throw "Untrusted target/runner-label pair: $target / $label"
          }

      - name: Checkout exact trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          clean: true

      - name: Prove interactive Windows workstation
        shell: powershell
        run: ./tools/windows_live_e2e_preflight.ps1 -TargetOs "${{ inputs.target_os }}" -JsonOut live-e2e-artifacts/preflight.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install exact build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_build.txt

      - name: Lock known-good production and test surface
        run: python tools/regression_lock_check.py

      - name: Lock mandatory CI regression topology
        run: python tools/ci_gate_lock.py

      - name: Verify regression lock coverage inventory
        run: python tests/regression_surface_inventory.py

      - name: Guard document mechanics
        run: python tools/document_mechanics_guard.py

      - name: Run production safety gate
        run: python tools/production_safety_gate.py

      - name: Run privacy-safe diagnostics contract
        run: python tools/privacy_diagnostics_check.py

      - name: Run production audit
        run: python prod_audit.py

      - name: Run release gate
        run: python release_check.py

      - name: Run full patient replay and golden DOCX regression
        run: python tools/full_patient_replay_check.py

      - name: Run long clinical block integrity regression
        env:
          PYTHONPATH: .
        run: python tools/docx_block_boundary_regression.py

      - name: Run complete clinical field roundtrip matrix
        env:
          PYTHONPATH: .
        run: python tests/clinical_roundtrip_matrix.py

      - name: Run one-paragraph primary document regression
        env:
          PYTHONPATH: .
        run: python tests/one_paragraph_primary_regression.py

      - name: Run full user journey regression
        env:
          PYTHONPATH: .
        run: python tests/full_user_journey_regression.py

      - name: Run all 255 output-selection combinations
        env:
          PYTHONPATH: .
        run: python tests/windows_e1_exhaustive_user_matrix.py

      - name: Run staff profile regression
        env:
          PYTHONPATH: .
        run: python tools/staff_profile_regression.py

      - name: Run gender generation regression matrix
        env:
          PYTHONPATH: .
        run: python tools/gender_generation_regression_matrix.py

      - name: Run diagnosis override and diary-text regression
        env:
          PYTHONPATH: .
        run: python tests/diagnosis_override_regression.py

      - name: Run words-only diary source regression
        env:
          PYTHONPATH: .
        run: python tests/verbal_diary_source_regression.py

      - name: Enforce canonical generation performance budget
        env:
          PYTHONPATH: .
        run: python tools/generation_performance_profile.py --runs 3 --json-out live-e2e-artifacts/generation-performance.json

      - name: Run user-perceived performance profile
        env:
          PYTHONPATH: .
        run: python tools/user_perceived_performance_profile.py

      - name: Run desktop intake contract
        run: python tests/desktop_intake_contract_check.py

      - name: Run intake lifecycle regression
        run: python tests/intake_lifecycle_regression.py

      - name: Run real Tk GUI wiring smoke
        run: python gui_runtime_check.py

      - name: Run physical-input Windows live GUI E2E
        env:
          LIVE_E2E_ARTIFACT_DIR: live-e2e-artifacts
        run: python tests/windows_live_gui_e2e.py

      - name: Build EXE
        shell: cmd
        run: build_exe_windows.bat

      - name: Verify packaged EXE startup and TkDND
        run: python verify_built_exe.py

      - name: Run packaged desktop intake auto-launch E2E
        shell: powershell
        run: ./tools/windows_desktop_intake_e2e.ps1 -AppPath ./dist/MedicalDiaryAutofill.exe

      - name: Require preinstalled Inno Setup 6
        shell: powershell
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if (-not $paths) {
            throw "Inno Setup 6 is a permanent live-runner prerequisite; install it on the dedicated Windows test workstation."
          }

      - name: Build Windows installer
        shell: cmd
        run: BUILD_WINDOWS_INSTALLER.bat

      - name: Smoke installed and uninstalled application
        shell: powershell
        run: ./tools/windows_installer_smoke.ps1 -InstallerPath ./dist/MedicalDiaryAutofill-Setup-1.4.30.exe

      - name: Capture desktop evidence on failure
        if: failure()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path live-e2e-artifacts | Out-Null
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $PWD "live-e2e-artifacts\failure-desktop.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
          } catch {
            "screenshot failed: $($_.Exception.GetType().Name)" | Set-Content live-e2e-artifacts/failure-screenshot.txt
          }

      - name: Upload live E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MedicalDiaryAutofill-${{ inputs.target_os }}-Live-E2E-${{ github.run_id }}
          path: |
            live-e2e-artifacts/
            generation_finalize_profile.json
          if-no-files-found: warn
          retention-days: 14
