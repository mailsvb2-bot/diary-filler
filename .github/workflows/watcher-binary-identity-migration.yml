name: Temporary watcher binary identity migration

on:
  push:
    branches: [fix/watcher-binary-identity]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[identity-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install contract dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install -r requirements_build.txt
      - name: Make watcher identity build-specific
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          startup = Path('startup.py')
          text = startup.read_text(encoding='utf-8')
          old = '''def _desktop_current_agent_identity() -> str:\n    raw = "\\0".join(_desktop_native_gui_command()).encode("utf-8", errors="surrogatepass")\n    return hashlib.sha256(raw).hexdigest()\n\n\n'''
          new = '''def _desktop_agent_identity_file_digest(path: Path) -> str:\n    digest = hashlib.sha256()\n    try:\n        with path.open("rb") as stream:\n            for chunk in iter(lambda: stream.read(1024 * 1024), b""):\n                digest.update(chunk)\n        return f"sha256:{digest.hexdigest()}"\n    except OSError:\n        try:\n            stat = path.stat()\n            return f"stat:{stat.st_size}:{stat.st_mtime_ns}"\n        except OSError:\n            return "missing"\n\n\ndef _desktop_build_agent_identity(command: list[str]) -> str:\n    \"\"\"Bind an agent to the actual build loaded by this process, not only its path.\"\"\"\n    digest = hashlib.sha256()\n    for item in command:\n        digest.update(item.encode("utf-8", errors="surrogatepass"))\n        digest.update(b"\\0")\n\n    candidates: list[Path] = []\n    if command:\n        candidates.append(Path(command[0]))\n    if len(command) >= 2 and command[1].lower().endswith((".py", ".pyw")):\n        candidates.append(Path(command[1]))\n    if not getattr(sys, "frozen", False):\n        candidates.append(Path(__file__).resolve())\n\n    seen: set[str] = set()\n    for candidate in candidates:\n        try:\n            normalized = candidate.expanduser().absolute()\n        except OSError:\n            normalized = candidate\n        key = os.path.normcase(str(normalized))\n        if key in seen:\n            continue\n        seen.add(key)\n        digest.update(str(normalized).encode("utf-8", errors="surrogatepass"))\n        digest.update(b"\\0")\n        digest.update(_desktop_agent_identity_file_digest(normalized).encode("ascii"))\n        digest.update(b"\\0")\n    return digest.hexdigest()\n\n\n_DESKTOP_AGENT_IDENTITY_CACHE: str | None = None\n\n\ndef _desktop_current_agent_identity() -> str:\n    global _DESKTOP_AGENT_IDENTITY_CACHE\n    if _DESKTOP_AGENT_IDENTITY_CACHE is None:\n        _DESKTOP_AGENT_IDENTITY_CACHE = _desktop_build_agent_identity(\n            _desktop_native_gui_command()\n        )\n    return _DESKTOP_AGENT_IDENTITY_CACHE\n\n\n'''
          if old not in text:
              raise SystemExit('startup identity anchor not found')
          startup.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/desktop_intake_contract_check.py')
          t = tests.read_text(encoding='utf-8')
          start = t.index('def _assert_agent_update_and_encoding_contract() -> None:\n')
          end = t.index('\n\ndef main() -> None:\n', start)
          replacement = '''def _assert_agent_update_and_encoding_contract() -> None:\n    payload = startup.desktop_intake_startup_vbs_payload(\n        [r"C:\\\\Программа\\\\MedicalDiaryAutofill.exe", startup.DESKTOP_INTAKE_AGENT_ARGUMENT]\n    )\n    encoded = payload.encode("utf-16")\n    assert encoded.startswith(b"\\xff\\xfe")\n    assert not encoded.startswith(b"\\xef\\xbb\\xbf")\n    assert payload.splitlines()[0] == "On Error Resume Next"\n    assert "WScript.Shell" in payload\n    assert "shell.Run" in payload\n\n    with tempfile.TemporaryDirectory() as tmp:\n        runtime = Path(tmp)\n        current = runtime / "new" / "MedicalDiaryAutofill.exe"\n        current.parent.mkdir()\n        current.write_bytes(b"current-build")\n        old = runtime / "old" / "MedicalDiaryAutofill.exe"\n        old.parent.mkdir()\n        old.write_bytes(b"old-build")\n        same_path = runtime / "same" / "MedicalDiaryAutofill.exe"\n        same_path.parent.mkdir()\n        same_path.write_bytes(b"same-path-old-build")\n\n        original_runtime_dir = startup._desktop_runtime_dir\n        original_native_command = startup._desktop_native_gui_command\n        original_identity_cache = startup._DESKTOP_AGENT_IDENTITY_CACHE\n        try:\n            startup._desktop_runtime_dir = lambda: runtime  # type: ignore[assignment]\n\n            current_command = [str(current)]\n            current_identity = startup._desktop_build_agent_identity(current_command)\n            startup._desktop_native_gui_command = lambda: current_command  # type: ignore[assignment]\n            startup._DESKTOP_AGENT_IDENTITY_CACHE = current_identity\n            startup._desktop_write_agent_handoff()\n            assert startup._desktop_agent_is_retired() is False\n            assert startup._desktop_launch_command() == current_command\n\n            old_command = [str(old)]\n            old_identity = startup._desktop_build_agent_identity(old_command)\n            assert old_identity != current_identity\n            startup._desktop_native_gui_command = lambda: old_command  # type: ignore[assignment]\n            startup._DESKTOP_AGENT_IDENTITY_CACHE = old_identity\n            assert startup._desktop_agent_is_retired() is True\n            assert startup._desktop_launch_command() == current_command\n\n            same_command = [str(same_path)]\n            old_same_identity = startup._desktop_build_agent_identity(same_command)\n            same_path.write_bytes(b"same-path-new-build")\n            new_same_identity = startup._desktop_build_agent_identity(same_command)\n            assert old_same_identity != new_same_identity, (old_same_identity, new_same_identity)\n\n            startup._desktop_native_gui_command = lambda: same_command  # type: ignore[assignment]\n            startup._DESKTOP_AGENT_IDENTITY_CACHE = new_same_identity\n            startup._desktop_write_agent_handoff()\n            startup._DESKTOP_AGENT_IDENTITY_CACHE = old_same_identity\n            assert startup._desktop_agent_is_retired() is True, (\n                "an old in-memory watcher must retire when the EXE is replaced in-place"\n            )\n            assert startup._desktop_launch_command() == same_command\n        finally:\n            startup._DESKTOP_AGENT_IDENTITY_CACHE = original_identity_cache\n            startup._desktop_runtime_dir = original_runtime_dir  # type: ignore[assignment]\n            startup._desktop_native_gui_command = original_native_command  # type: ignore[assignment]\n'''
          tests.write_text(t[:start] + replacement + t[end:], encoding='utf-8')
          PY
          python tests/desktop_intake_contract_check.py
          python tools/production_safety_gate.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add startup.py tests/desktop_intake_contract_check.py
          git commit -m "Bind watcher identity to installed build [identity-fix]"
          git push
