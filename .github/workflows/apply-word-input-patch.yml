name: Apply exact Word input candidate

on:
  push:
    branches:
      - fix/word-primary-doc-docx-docm

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/.word-input.patch)" = "3b5c528d9f694c3b95a30477f590958c80cd3656"
          git apply --check tools/.word-input.patch
          git apply tools/.word-input.patch
          rm tools/.word-input.patch
          rm .github/workflows/apply-word-input-patch.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: support doc docx and docm Word inputs"
          git push origin HEAD:fix/word-primary-doc-docx-docm
