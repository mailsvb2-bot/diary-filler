name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v1.4.0-style tag to publish
        required: true
        type: string
  push:
    branches: [production-v1.4.13]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v1.4.13' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Resolve and guard release target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            if ("${{ github.ref }}" -ne "refs/heads/production-v1.4.13") {
              throw "One-shot release may run only from refs/heads/production-v1.4.13."
            }
            $mainSha = gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq ".object.sha"
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($mainSha)) {
              throw "Unable to resolve current main SHA."
            }
            if ($mainSha.Trim() -ne "${{ github.sha }}") {
              throw "One-shot release branch is not the exact current main SHA; refusing to publish."
            }
            $tag = "v1.4.13"
            $matchingTagRefs = @(gh api "repos/${{ github.repository }}/git/matching-refs/tags/$tag" --jq ".[].ref")
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to inspect existing release tags."
            }
            if ($matchingTagRefs -contains "refs/tags/$tag") {
              throw "Tag $tag already exists; refusing to move or overwrite it."
            }
          } else {
            $tag = "${{ inputs.tag }}"
            if ([string]::IsNullOrWhiteSpace($tag)) { throw "Release tag input is empty." }
            $tagSha = git rev-list -n 1 $tag
            $headSha = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $tagSha.Trim() -ne $headSha.Trim()) {
              throw "Checked-out release tag does not resolve to HEAD."
            }
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_build.txt

      - name: Lock known-good production and test surface
        run: python tools/regression_lock_check.py

      - name: Lock mandatory CI regression topology
        run: python tools/ci_gate_lock.py

      - name: Verify regression lock coverage inventory
        run: python tests/regression_surface_inventory.py

      - name: Guard document mechanics
        run: python tools/document_mechanics_guard.py

      - name: Run production safety gate
        run: python tools/production_safety_gate.py

      - name: Run privacy-safe diagnostics contract
        run: python tools/privacy_diagnostics_check.py

      - name: Run production audit
        run: python prod_audit.py

      - name: Run release gate
        run: python release_check.py

      - name: Run full patient replay and golden DOCX regression
        run: python tools/full_patient_replay_check.py

      - name: Run staff profile regression
        env:
          PYTHONPATH: .
        run: python tools/staff_profile_regression.py

      - name: Run gender generation regression matrix
        env:
          PYTHONPATH: .
        run: python tools/gender_generation_regression_matrix.py

      - name: Run diagnosis override and diary-text regression
        env:
          PYTHONPATH: .
        run: python tests/diagnosis_override_regression.py

      - name: Run words-only diary source regression
        env:
          PYTHONPATH: .
        run: python tests/verbal_diary_source_regression.py

      - name: Run desktop intake contract
        run: python tests/desktop_intake_contract_check.py

      - name: Run intake lifecycle regression
        run: python tests/intake_lifecycle_regression.py

      - name: Run real Tk GUI wiring smoke
        run: python gui_runtime_check.py

      - name: Build EXE
        shell: cmd
        run: build_exe_windows.bat

      - name: Verify exact packaged EXE
        run: python verify_built_exe.py

      - name: Run packaged desktop intake E2E
        shell: pwsh
        run: ./tools/windows_desktop_intake_e2e.ps1 -AppPath ./dist/MedicalDiaryAutofill.exe

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if (-not $paths) {
            choco install innosetup --no-progress -y
          }

      - name: Build Windows installer from verified EXE
        shell: cmd
        run: BUILD_WINDOWS_INSTALLER.bat

      - name: Smoke installed and uninstalled application
        shell: pwsh
        run: ./tools/windows_installer_smoke.ps1 -InstallerPath ./dist/MedicalDiaryAutofill-Setup-1.4.13.exe

      - name: Build clean source archive
        run: python make_release_zip.py

      - name: Create guarded release tag
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $mainSha = gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq ".object.sha"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($mainSha)) {
            throw "Unable to re-resolve current main SHA before tag creation."
          }
          if ($mainSha.Trim() -ne "${{ github.sha }}") {
            throw "Current main moved during release validation; refusing to create the release tag."
          }
          $matchingTagRefs = @(gh api "repos/${{ github.repository }}/git/matching-refs/tags/$env:RELEASE_TAG" --jq ".[].ref")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to re-inspect existing release tags."
          }
          if ($matchingTagRefs -contains "refs/tags/$env:RELEASE_TAG") {
            throw "Tag $env:RELEASE_TAG already exists; refusing to move or overwrite it."
          }
          gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$env:RELEASE_TAG" -f sha="${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create immutable release tag $env:RELEASE_TAG." }
          git fetch origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch newly created release tag $env:RELEASE_TAG." }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTags = @(gh api --paginate "repos/${{ github.repository }}/releases" --jq ".[].tag_name")
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect existing GitHub Releases." }
          if ($releaseTags -contains $env:RELEASE_TAG) { throw "Release $env:RELEASE_TAG already exists; refusing to overwrite it." }
          gh release create "$env:RELEASE_TAG" dist\MedicalDiaryAutofill.exe dist\MedicalDiaryAutofill-Setup-1.4.13.exe release\MedicalDiaryAutofill_PRODUCTION_SOURCE.zip --verify-tag --title "MedicalDiaryAutofill $env:RELEASE_TAG" --generate-notes
