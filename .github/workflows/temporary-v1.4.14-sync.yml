name: Temporary v1.4.14 metadata sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/v1.4.14-intake-autolaunch
          fetch-depth: 0
      - name: Finish exact metadata synchronization
        shell: python
        run: |
          from pathlib import Path

          path = Path("prod_audit.py")
          text = path.read_text(encoding="utf-8")
          old = "MedicalDiaryAutofill-Setup-1.4.13.exe"
          new = "MedicalDiaryAutofill-Setup-1.4.14.exe"
          if old in text:
              path.write_text(text.replace(old, new), encoding="utf-8")
          elif new not in text:
              raise SystemExit("prod_audit.py has neither the expected old nor new installer marker")

          helper = Path(".github/workflows/release-bump-helper.yml")
          if helper.exists():
              helper.unlink()
      - name: Commit target branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No target changes needed"
            exit 0
          fi
          git commit -m "release: finish v1.4.14 gate synchronization"
          git push origin HEAD:release/v1.4.14-intake-autolaunch
