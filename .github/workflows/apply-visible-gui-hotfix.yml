name: Apply visible GUI hotfix
on:
  push:
    branches:
      - automation/visible-gui-helper
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "35a01bb2fb08b28e6634356e9fc9a28678b13c25"
          cat > /tmp/visible.patch.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/visible.patch.gz.b64 > /tmp/visible.patch.gz
          test "$(sha256sum /tmp/visible.patch.gz | awk '{print $1}')" = "35f14b2a2fdea80f050484a521accae9b1490b923296d5b82bd07317a1632887"
          gzip -dc /tmp/visible.patch.gz > /tmp/visible.patch
          test "$(sha256sum /tmp/visible.patch | awk '{print $1}')" = "5899b025e37e0c7ea06b9ed9a9c526d113bf62bf03c5c66e840e71e4f2cadb73"
          git apply --check /tmp/visible.patch
          git apply /tmp/visible.patch
          test "$(git hash-object startup.py)" = "a8d8cb72723fd4d2011ee8a1d6ae9f9a3ae3db54"
          test "$(git hash-object tools/production_safety_gate.py)" = "d3ec02cadc1758a3259554de666c1b51531da4e9"
          test "$(git hash-object tools/windows_desktop_intake_e2e.ps1)" = "56cb7a4c7264e321ff33ddcc6eee00e655c22e14"
          python -m py_compile startup.py tools/production_safety_gate.py
          git diff --check
      - name: Commit exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add startup.py tools/production_safety_gate.py tools/windows_desktop_intake_e2e.ps1
          git commit -m "Ensure desktop intake opens a visible GUI"
          test "$(git rev-parse HEAD^{tree})" = "41f102ddc72d5338c7199b035a657a6d5d8ca740"
          git push origin HEAD:fix/desktop-intake-visible
      - name: Remove helper branch
        if: always()
        shell: bash
        run: git push origin --delete automation/visible-gui-helper || true
