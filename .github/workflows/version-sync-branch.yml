name: Temporary version metadata sync

on:
  push:
    branches: [release/1.4.5-intake-lifecycle]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[version-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/1.4.5-intake-lifecycle
          fetch-depth: 0
      - name: Update production audit version constants exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('prod_audit.py')
          text = path.read_text(encoding='utf-8')
          old_version = 'TARGET_VERSION = "1.4.4"'
          old_label = 'TARGET_VERSION_LABEL = "v1.4.4-date-linking-and-tail-cleanup"'
          assert text.count(old_version) == 1, text.count(old_version)
          assert text.count(old_label) == 1, text.count(old_label)
          text = text.replace(old_version, 'TARGET_VERSION = "1.4.5"')
          text = text.replace(old_label, 'TARGET_VERSION_LABEL = "v1.4.5-intake-lifecycle"')
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prod_audit.py
          git diff --cached --check
          git commit -m "Sync production audit to 1.4.5 [version-sync]"
          git push origin HEAD:release/1.4.5-intake-lifecycle
