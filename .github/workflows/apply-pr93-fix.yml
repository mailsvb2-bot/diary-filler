name: Apply PR93 exact fix

on:
  push:
    branches:
      - fix/word-primary-canonical-parser-followup
    paths:
      - tools/.pr93-fix.patch
      - .github/workflows/apply-pr93-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Apply exact patch and remove staging files
        shell: bash
        run: |
          git apply --check tools/.pr93-fix.patch
          git apply tools/.pr93-fix.patch
          rm tools/.pr93-fix.patch .github/workflows/apply-pr93-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: materialize legacy doc once in intake classifier"
          git push origin HEAD:fix/word-primary-canonical-parser-followup
