name: Temporary inline release version migration

on:
  push:
    branches: [release/1.4.5-intake-lifecycle]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[version-inline]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/1.4.5-intake-lifecycle
          fetch-depth: 0
      - name: Inline release version without adding a runtime module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('main.py')
          text = main.read_text(encoding='utf-8')
          old = 'from release_version import APP_VERSION\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, 'APP_VERSION = "v1.4.5-intake-lifecycle"\n', 1)
          main.write_text(text, encoding='utf-8')

          verify = Path('verify_built_exe.py')
          text = verify.read_text(encoding='utf-8')
          old = 'from release_version import APP_VERSION\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, 'from main import APP_VERSION\n', 1)
          verify.write_text(text, encoding='utf-8')

          audit = Path('prod_audit.py')
          text = audit.read_text(encoding='utf-8')
          old_read = '    release_version = _read("release_version.py")'
          new_read = '    main_source = _read("main.py")'
          old_check = '        "release_version APP_VERSION": TARGET_VERSION_LABEL in release_version,'
          new_check = '        "main APP_VERSION": f\'APP_VERSION = "{TARGET_VERSION_LABEL}"\' in main_source,'
          assert text.count(old_read) == 1, text.count(old_read)
          assert text.count(old_check) == 1, text.count(old_check)
          text = text.replace(old_read, new_read, 1).replace(old_check, new_check, 1)
          audit.write_text(text, encoding='utf-8')

          gate = Path('release_check.py')
          text = gate.read_text(encoding='utf-8')
          old = '    "release_version.py",\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, '', 1)
          gate.write_text(text, encoding='utf-8')
          PY
          rm release_version.py
          python -m compileall -q main.py prod_audit.py release_check.py verify_built_exe.py
          python tools/production_safety_gate.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.py verify_built_exe.py prod_audit.py release_check.py release_version.py
          git commit -m "Keep 1.4.5 versioning within runtime budget [version-inline]"
          git push origin HEAD:release/1.4.5-intake-lifecycle
