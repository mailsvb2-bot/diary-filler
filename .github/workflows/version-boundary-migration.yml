name: Temporary release version boundary migration

on:
  push:
    branches: [release/1.4.5-intake-lifecycle]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[version-boundary]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/1.4.5-intake-lifecycle
          fetch-depth: 0
      - name: Move release identity outside protected document configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('main.py')
          text = main.read_text(encoding='utf-8')
          old = '    APP_VERSION,\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, '', 1)
          anchor = ')\nfrom startup import ('
          assert text.count(anchor) == 1, text.count(anchor)
          text = text.replace(anchor, ')\nfrom release_version import APP_VERSION\nfrom startup import (', 1)
          main.write_text(text, encoding='utf-8')

          audit = Path('prod_audit.py')
          text = audit.read_text(encoding='utf-8')
          old_read = '    app_config = _read("app_config.py")'
          new_read = '    release_version = _read("release_version.py")'
          old_check = '        "app_config APP_VERSION": TARGET_VERSION_LABEL in app_config,'
          new_check = '        "release_version APP_VERSION": TARGET_VERSION_LABEL in release_version,'
          assert text.count(old_read) == 1, text.count(old_read)
          assert text.count(old_check) == 1, text.count(old_check)
          text = text.replace(old_read, new_read, 1).replace(old_check, new_check, 1)
          audit.write_text(text, encoding='utf-8')

          gate = Path('release_check.py')
          text = gate.read_text(encoding='utf-8')
          anchor = '    "main.py",\n'
          assert text.count(anchor) == 1, text.count(anchor)
          text = text.replace(anchor, anchor + '    "release_version.py",\n', 1)
          gate.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q main.py prod_audit.py release_check.py release_version.py
          git diff --check
          git grep -n APP_VERSION -- '*.py' || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.py prod_audit.py release_check.py release_version.py
          git commit -m "Separate release version from protected mechanics [version-boundary]"
          git push origin HEAD:release/1.4.5-intake-lifecycle
