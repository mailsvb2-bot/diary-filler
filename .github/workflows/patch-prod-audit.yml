name: Patch unsigned release audit contract

on:
  push:
    branches: [release/unsigned-v1.4.13]
    paths: [.github/workflows/patch-prod-audit.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/unsigned-v1.4.13
          fetch-depth: 0
      - name: Update production audit contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('prod_audit.py')
          text = path.read_text(encoding='utf-8')
          old = '''        (release_workflow, "SIGNING_CERT_PFX_BASE64", "official release must require a signing certificate"),\n        (release_workflow, "signtool verify", "official release must verify Authenticode"),'''
          new = '''        (release_workflow, "python tools/document_mechanics_guard.py", "official release must guard document mechanics"),\n        (release_workflow, "python verify_built_exe.py", "official release must verify the exact packaged EXE"),\n        (release_workflow, "./tools/windows_desktop_intake_e2e.ps1 -AppPath ./dist/MedicalDiaryAutofill.exe", "official release must exercise packaged desktop intake"),\n        (release_workflow, "./tools/windows_installer_smoke.ps1 -InstallerPath ./dist/MedicalDiaryAutofill-Setup-1.4.13.exe", "official release must smoke-test install/uninstall"),\n        (release_workflow, "Create guarded release tag", "official release must create its immutable tag only after validation"),'''
          if text.count(old) != 1:
              raise SystemExit('expected signed-release audit block exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit exact audit update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prod_audit.py
          git diff --cached --check
          git commit -m "audit: validate verified unsigned release path"
          git push origin HEAD:release/unsigned-v1.4.13
