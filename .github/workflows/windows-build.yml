name: Windows EXE Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: windows-exe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MEDICAL_AUTOFILL_LICENSE_SERVER_URL: ${{ vars.MEDICAL_AUTOFILL_LICENSE_SERVER_URL }}
      MEDICAL_AUTOFILL_LICENSE_PUBLIC_KEY_B64: ${{ vars.MEDICAL_AUTOFILL_LICENSE_PUBLIC_KEY_B64 }}
      MEDICAL_AUTOFILL_LICENSE_REQUIRED: ${{ vars.MEDICAL_AUTOFILL_LICENSE_SERVER_URL != '' && vars.MEDICAL_AUTOFILL_LICENSE_PUBLIC_KEY_B64 != '' && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Guard main branch provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/main_branch_policy.py

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_build.txt

      - name: Guard binary artifact licensing policy
        shell: pwsh
        run: |
          $hasUrl = -not [string]::IsNullOrWhiteSpace($env:MEDICAL_AUTOFILL_LICENSE_SERVER_URL)
          $hasKey = -not [string]::IsNullOrWhiteSpace($env:MEDICAL_AUTOFILL_LICENSE_PUBLIC_KEY_B64)
          if ($hasUrl -xor $hasKey) {
            throw "Windows CI licensing variables are partially configured; refusing ambiguous binary build."
          }
          if ($hasUrl -and $hasKey) {
            if ($env:MEDICAL_AUTOFILL_LICENSE_REQUIRED -ne "1") {
              throw "Licensed Windows CI build must set MEDICAL_AUTOFILL_LICENSE_REQUIRED=1."
            }
            Write-Host "Windows CI binary artifacts are production-licensed."
          } else {
            if ($env:MEDICAL_AUTOFILL_LICENSE_REQUIRED -ne "0") {
              throw "Unconfigured Windows CI must stay in internal test-build mode."
            }
            Write-Warning "License variables are absent: binary artifacts will NOT be published."
          }

      - name: Lock known-good production and test surface
        run: python tools/regression_lock_check.py

      - name: Lock licensed-only Windows binary artifact publication
        run: python tests/windows_ci_artifact_licensing_contract.py

      - name: Lock mandatory CI regression topology
        run: python tools/ci_gate_lock.py

      - name: Verify regression lock coverage inventory
        run: python tests/regression_surface_inventory.py

      - name: Lock Windows 10 + 11 live E2E infrastructure
        run: python tests/windows_live_e2e_contract.py

      - name: Guard document mechanics
        env:
          DOCUMENT_MECHANICS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/document_mechanics_guard.py

      - name: Run production safety gate
        run: python tools/production_safety_gate.py

      - name: Run privacy-safe diagnostics contract
        run: python tools/privacy_diagnostics_check.py

      - name: Run production audit
        run: python prod_audit.py

      - name: Run release gate
        run: python release_check.py

      - name: Run full patient replay and golden DOCX regression
        run: python tools/full_patient_replay_check.py

      - name: Run long clinical block integrity regression
        env:
          PYTHONPATH: .
        run: python tools/docx_block_boundary_regression.py

      - name: Run complete clinical field roundtrip matrix
        env:
          PYTHONPATH: .
        run: python tests/clinical_roundtrip_matrix.py

      - name: Run one-paragraph primary document regression
        env:
          PYTHONPATH: .
        run: python tests/one_paragraph_primary_regression.py

      - name: Run full user journey regression
        env:
          PYTHONPATH: .
        run: python tests/full_user_journey_regression.py

      - name: Run Windows E1 exhaustive finite user matrix
        env:
          PYTHONPATH: .
        run: python tests/windows_e1_exhaustive_user_matrix.py

      - name: Run staff profile regression
        env:
          PYTHONPATH: .
        run: python tools/staff_profile_regression.py

      - name: Run gender generation regression matrix
        env:
          PYTHONPATH: .
        run: python tools/gender_generation_regression_matrix.py

      - name: Run diagnosis override and diary-text regression
        env:
          PYTHONPATH: .
        run: python tests/diagnosis_override_regression.py

      - name: Run words-only diary source regression
        env:
          PYTHONPATH: .
        run: python tests/verbal_diary_source_regression.py

      - name: Profile canonical document generation
        env:
          PYTHONPATH: .
        run: python tools/generation_performance_profile.py --runs 3 --json-out generation_performance_profile.json

      - name: Profile user-perceived parse and generation latency
        env:
          PYTHONPATH: .
        run: python tools/user_perceived_performance_profile.py

      - name: Upload generation performance profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MedicalDiaryAutofill-Generation-Performance
          path: generation_performance_profile.json
          if-no-files-found: error

      - name: Profile renderer finalization hotspots
        env:
          PYTHONPATH: .
        run: python tools/generation_finalize_profile.py

      - name: Upload renderer finalization profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MedicalDiaryAutofill-Generation-Finalization-Profile
          path: generation_finalize_profile.json
          if-no-files-found: error

      - name: Run desktop intake contract
        run: python tests/desktop_intake_contract_check.py

      - name: Run intake lifecycle regression
        run: python tests/intake_lifecycle_regression.py

      - name: Run real Tk GUI wiring smoke
        run: python gui_runtime_check.py

      - name: Build EXE
        shell: cmd
        run: build_exe_windows.bat

      - name: Verify packaged EXE startup and TkDND
        run: python verify_built_exe.py

      - name: Run packaged desktop intake auto-launch E2E
        shell: pwsh
        env:
          MEDICAL_AUTOFILL_CI_ACTIVATION_CODE: ${{ secrets.MEDICAL_AUTOFILL_CI_ACTIVATION_CODE }}
        run: ./tools/windows_desktop_intake_e2e.ps1 -AppPath ./dist/MedicalDiaryAutofill.exe

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if (-not $paths) {
            choco install innosetup --no-progress -y
          }

      - name: Build Windows installer
        shell: cmd
        run: BUILD_WINDOWS_INSTALLER.bat

      - name: Smoke installed and uninstalled application
        shell: pwsh
        env:
          MEDICAL_AUTOFILL_CI_ACTIVATION_CODE: ${{ secrets.MEDICAL_AUTOFILL_CI_ACTIVATION_CODE }}
        run: ./tools/windows_installer_smoke.ps1 -InstallerPath ./dist/MedicalDiaryAutofill-Setup-1.4.33.exe

      - name: Build clean source archive
        run: python make_release_zip.py

      - name: Upload EXE artifact
        if: ${{ vars.MEDICAL_AUTOFILL_LICENSE_SERVER_URL != '' && vars.MEDICAL_AUTOFILL_LICENSE_PUBLIC_KEY_B64 != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MedicalDiaryAutofill-Windows-EXE
          path: dist/MedicalDiaryAutofill.exe
          if-no-files-found: error

      - name: Upload Windows installer artifact
        if: ${{ vars.MEDICAL_AUTOFILL_LICENSE_SERVER_URL != '' && vars.MEDICAL_AUTOFILL_LICENSE_PUBLIC_KEY_B64 != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MedicalDiaryAutofill-Windows-Installer
          path: dist/MedicalDiaryAutofill-Setup-1.4.33.exe
          if-no-files-found: error

      - name: Upload temporary final unlicensed installer artifact
        if: ${{ github.head_ref == 'ci/package-final-unlicensed-installer' || github.ref_name == 'ci/package-final-unlicensed-installer' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MedicalDiaryAutofill-Final-Unlicensed-Installer
          path: dist/MedicalDiaryAutofill-Setup-1.4.33.exe
          if-no-files-found: error

      - name: Upload source release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MedicalDiaryAutofill-Production-Source
          path: release/MedicalDiaryAutofill_PRODUCTION_SOURCE.zip
          if-no-files-found: error
