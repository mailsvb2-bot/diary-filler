name: Release 1.4.13 metadata prep

on:
  push:
    branches: [release/1.4.13-primary-title-cache]
    paths: [.github/workflows/release-prep-selfapply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Apply exact release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '37bd053d26948cd211bfeba050adfaf27bec8234'
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = 'c08b9f43c2fc08ae63766ca907a770bc32578ad5'
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          LABEL = 'v1.4.13-fio-diagnosis-speed'
          BASE = 'c08b9f43c2fc08ae63766ca907a770bc32578ad5'
          BASELINE = 'a23c47b76b50eb487407166b9528fa6120862a1d'

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')
          def repl(p, old, new, count=1):
              s = read(p)
              if s.count(old) != count:
                  raise SystemExit(f'{p}: expected {count} x {old!r}, got {s.count(old)}')
              write(p, s.replace(old, new))
          def blob_worktree(p):
              return subprocess.check_output(['git', 'hash-object', p], text=True).strip()
          def blob_index(p):
              return subprocess.check_output(['git', 'rev-parse', f':{p}'], text=True).strip()

          repl('app_config.py', 'APP_VERSION = "v1.4.13-primary-title-cache"', f'APP_VERSION = "{LABEL}"')
          repl('version_info.txt', 'filevers=(1, 4, 12, 0)', 'filevers=(1, 4, 13, 0)')
          repl('version_info.txt', 'prodvers=(1, 4, 12, 0)', 'prodvers=(1, 4, 13, 0)')
          repl('version_info.txt', 'v1.4.12-fio-diary-persistence', LABEL, 2)
          repl('installer/MedicalDiaryAutofill.iss', '#define MyAppVersion "1.4.12"', '#define MyAppVersion "1.4.13"')
          repl('.github/workflows/windows-build.yml', 'MedicalDiaryAutofill-Setup-1.4.12.exe', 'MedicalDiaryAutofill-Setup-1.4.13.exe', 2)
          desired_windows_blob = blob_worktree('.github/workflows/windows-build.yml')
          repl('tools/ci_gate_lock.py', 'MedicalDiaryAutofill-Setup-1.4.12.exe', 'MedicalDiaryAutofill-Setup-1.4.13.exe')
          repl('prod_audit.py', 'TARGET_VERSION = "1.4.12"', 'TARGET_VERSION = "1.4.13"')
          repl('prod_audit.py', 'TARGET_VERSION_LABEL = "v1.4.12-fio-diary-persistence"', f'TARGET_VERSION_LABEL = "{LABEL}"')
          repl('README.md', '**Версия:** `v1.4.12-fio-diary-persistence`', f'**Версия:** `{LABEL}`')

          notes = read('RELEASE_NOTES.md')
          if not notes.startswith('# Release notes — v1.4.12-fio-diary-persistence'):
              raise SystemExit('unexpected current release-notes head')
          block = f'''# Release notes — {LABEL}\n\n## {LABEL}\n\n- Исправлено распознавание Ф.И.О. в реальных первичных DOCX с явными вариантами подписей; имя по-прежнему не угадывается из названия файла.\n- Исправлено загрязнение диагноза склеенным Word-текстом после строки диагноза.\n- Ускорен повторный подбор текстов дневников в больших папках без изменения words-only семантики.\n- Ускорено повторное чтение даты поступления из заголовка неизменённого первичного DOCX; изменение файла немедленно инвалидирует кэш.\n- Исправления PR #69 и PR #70 уже прошли exact, clean, post-merge и baseline-main Windows CI по полному 34-шаговому контуру, включая 8 canonical golden DOCX.\n- Версия EXE/package/installer синхронизирована как `1.4.13` / `{LABEL}`; installer: `MedicalDiaryAutofill-Setup-1.4.13.exe`.\n- Renderer/template, клинические формулировки, календарь/каденс и формат дневников не меняются.\n\n'''
          write('RELEASE_NOTES.md', block + notes)

          stage = ['BUILD_WINDOWS_INSTALLER.bat','README.md','RELEASE_NOTES.md','app_config.py','installer/MedicalDiaryAutofill.iss','prod_audit.py','pyproject.toml','tools/ci_gate_lock.py','version_info.txt']
          subprocess.run(['git','add','--',*stage], check=True)

          doc = {'schema_version':1,'base_sha':BASE,'reason':'Release-only version synchronization for v1.4.13-fio-diagnosis-speed. app_config.py changes only APP_VERSION; parser, renderer, template, diary generation, clinical wording, formatting and golden DOCX mechanics are unchanged.','approved_blobs':{'app_config.py':blob_index('app_config.py')}}
          write('tools/document_mechanics_change_approval.json', json.dumps(doc,ensure_ascii=False,indent=2)+'\n')
          subprocess.run(['git','add','--','tools/document_mechanics_change_approval.json'], check=True)

          critical = ['BUILD_WINDOWS_INSTALLER.bat','app_config.py','installer/MedicalDiaryAutofill.iss','prod_audit.py','pyproject.toml','tools/ci_gate_lock.py','tools/document_mechanics_change_approval.json','version_info.txt']
          approved = {p:blob_index(p) for p in critical}
          approved['.github/workflows/windows-build.yml'] = desired_windows_blob
          reg = {'schema_version':1,'baseline_ref':BASELINE,'reason':'Release-only synchronization for v1.4.13-fio-diagnosis-speed after PR #69 and PR #70 passed the full Windows contour; runtime document mechanics remain unchanged.','required_evidence':['ci_gate_lock','document_mechanics_guard','full_patient_replay','golden_docx','staff_profile_regression','gender_generation_matrix','desktop_intake_contract','intake_lifecycle_regression','packaged_desktop_intake_e2e','installer_uninstall_smoke'],'approved_blobs':approved}
          write('tools/regression_lock_change_approval.json', json.dumps(reg,ensure_ascii=False,indent=2)+'\n')
          subprocess.run(['git','add','--','tools/regression_lock_change_approval.json'], check=True)
          if json.loads(read('tests/regression_lock_baseline.json')).get('baseline_ref') != BASELINE:
              raise SystemExit('unexpected regression baseline')
          subprocess.run(['git','diff','--cached','--check'], check=True)
          print('DESIRED_WINDOWS_BLOB=' + desired_windows_blob)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Release 1.4.13 FIO diagnosis and speed fixes'
          git push origin HEAD:release/1.4.13-primary-title-cache
