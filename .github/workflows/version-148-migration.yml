name: Temporary 1.4.8 release metadata migration

on:
  push:
    branches: [release/1.4.8-watcher-update-handoff]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[release-148]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Synchronize 1.4.8 release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one {old!r}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          one("pyproject.toml", 'version = "1.4.7"', 'version = "1.4.8"')
          one("main.py", 'APP_VERSION = "v1.4.7-desktop-rebind"', 'APP_VERSION = "v1.4.8-watcher-update-handoff"')
          one("prod_audit.py", 'TARGET_VERSION = "1.4.7"', 'TARGET_VERSION = "1.4.8"')
          one("prod_audit.py", 'TARGET_VERSION_LABEL = "v1.4.7-desktop-rebind"', 'TARGET_VERSION_LABEL = "v1.4.8-watcher-update-handoff"')
          one("README.md", '**Версия:** `v1.4.7-desktop-rebind`', '**Версия:** `v1.4.8-watcher-update-handoff`')
          one("installer/MedicalDiaryAutofill.iss", '#define MyAppVersion "1.4.7"', '#define MyAppVersion "1.4.8"')

          p = Path("BUILD_WINDOWS_INSTALLER.bat")
          text = p.read_text(encoding="utf-8")
          if "1.4.8" not in text:
              if "1.4.7" not in text:
                  raise SystemExit("BUILD_WINDOWS_INSTALLER.bat: old version missing")
              p.write_text(text.replace("1.4.7", "1.4.8"), encoding="utf-8")

          p = Path("version_info.txt")
          text = p.read_text(encoding="utf-8")
          if "v1.4.8-watcher-update-handoff" not in text:
              if text.count("(1, 4, 7, 0)") != 2:
                  raise SystemExit("version_info.txt: old tuples mismatch")
              text = text.replace("(1, 4, 7, 0)", "(1, 4, 8, 0)")
              text = text.replace("v1.4.7-desktop-rebind", "v1.4.8-watcher-update-handoff")
              p.write_text(text, encoding="utf-8")

          p = Path("RELEASE_NOTES.md")
          text = p.read_text(encoding="utf-8")
          old_head = "# Release notes — v1.4.7-desktop-rebind\n\n## v1.4.7-desktop-rebind\n\n"
          if not text.startswith("# Release notes — v1.4.8-watcher-update-handoff"):
              if not text.startswith(old_head):
                  raise SystemExit("RELEASE_NOTES.md: old head mismatch")
              new_head = (
                  "# Release notes — v1.4.8-watcher-update-handoff\n\n"
                  "## v1.4.8-watcher-update-handoff\n\n"
                  "- Исправлено обновление программы поверх существующей установки: старый скрытый watcher больше не считается актуальным только потому, что новый EXE установлен по тому же пути.\n"
                  "- Identity watcher теперь привязан к фактической сборке, а не только к имени и пути EXE; старый процесс корректно завершает работу после handoff новой версии.\n"
                  "- Добавлен regression-contract для замены EXE новой сборкой в точности по тому же пути без перезагрузки Windows.\n"
                  "- Сохранены все исправления `Выписанные пациенты`: автоматическое создание, self-heal удалённой папки, динамический rebind при переносе Desktop/OneDrive и безопасное удаление приложения.\n"
                  "- Механика генерации документов не изменялась; document-mechanics guard, полный patient replay и golden DOCX regression остаются обязательными.\n"
                  "- Версия EXE, installer metadata, package metadata и CI-артефакта синхронизирована как `1.4.8` / `v1.4.8-watcher-update-handoff`.\n\n"
                  "## v1.4.7-desktop-rebind\n\n"
              )
              p.write_text(new_head + text[len(old_head):], encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml main.py prod_audit.py README.md RELEASE_NOTES.md installer/MedicalDiaryAutofill.iss BUILD_WINDOWS_INSTALLER.bat version_info.txt
          git commit -m "Version watcher update handoff release as 1.4.8 [release-148]"
          git push
