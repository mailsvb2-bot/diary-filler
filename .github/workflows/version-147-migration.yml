name: Temporary 1.4.7 release metadata migration

on:
  push:
    branches: [release/1.4.7-desktop-rebind]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Synchronize 1.4.7 release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one {old!r}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          one("pyproject.toml", 'version = "1.4.6"', 'version = "1.4.7"')
          one("main.py", 'APP_VERSION = "v1.4.6-watcher-selfheal"', 'APP_VERSION = "v1.4.7-desktop-rebind"')
          one("prod_audit.py", 'TARGET_VERSION = "1.4.6"', 'TARGET_VERSION = "1.4.7"')
          one("prod_audit.py", 'TARGET_VERSION_LABEL = "v1.4.6-watcher-selfheal"', 'TARGET_VERSION_LABEL = "v1.4.7-desktop-rebind"')
          one("README.md", '**Версия:** `v1.4.6-watcher-selfheal`', '**Версия:** `v1.4.7-desktop-rebind`')
          one("installer/MedicalDiaryAutofill.iss", '#define MyAppVersion "1.4.6"', '#define MyAppVersion "1.4.7"')

          p = Path("BUILD_WINDOWS_INSTALLER.bat")
          text = p.read_text(encoding="utf-8")
          if "1.4.7" not in text:
              if "1.4.6" not in text:
                  raise SystemExit("BUILD_WINDOWS_INSTALLER.bat: old version missing")
              p.write_text(text.replace("1.4.6", "1.4.7"), encoding="utf-8")

          p = Path("version_info.txt")
          text = p.read_text(encoding="utf-8")
          if "v1.4.7-desktop-rebind" not in text:
              if text.count("(1, 4, 6, 0)") != 2:
                  raise SystemExit("version_info.txt: old tuples mismatch")
              text = text.replace("(1, 4, 6, 0)", "(1, 4, 7, 0)")
              text = text.replace("v1.4.6-watcher-selfheal", "v1.4.7-desktop-rebind")
              p.write_text(text, encoding="utf-8")

          p = Path("RELEASE_NOTES.md")
          text = p.read_text(encoding="utf-8")
          old_head = "# Release notes — v1.4.6-watcher-selfheal\n\n## v1.4.6-watcher-selfheal\n\n"
          if not text.startswith("# Release notes — v1.4.7-desktop-rebind"):
              if not text.startswith(old_head):
                  raise SystemExit("RELEASE_NOTES.md: old head mismatch")
              new_head = """# Release notes — v1.4.7-desktop-rebind

## v1.4.7-desktop-rebind

- Hidden Windows watcher теперь заново определяет актуальный Desktop в каждом цикле и автоматически переключается на новый `Выписанные пациенты`, если OneDrive или `User Shell Folders` перенесли рабочий стол уже после запуска программы.
- Уже открытый GUI использует тот же динамический rebind и не остаётся привязанным к старой папке, даже если прежний Desktop-каталог физически продолжает существовать.
- Сохранено восстановление удалённой папки `Выписанные пациенты`; удаление каталога и перенос самого Desktop теперь покрыты разными regression-contract сценариями.
- Механика генерации документов не изменялась; document-mechanics guard, полный patient replay и golden DOCX regression остаются обязательными.
- Версия EXE, installer metadata, package metadata и CI-артефакта синхронизирована как `1.4.7` / `v1.4.7-desktop-rebind`.

## v1.4.6-watcher-selfheal

"""
              p.write_text(new_head + text[len(old_head):], encoding="utf-8")
          PY
          git diff --check
          if git diff --quiet; then
            echo "1.4.7 metadata already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml main.py prod_audit.py README.md RELEASE_NOTES.md installer/MedicalDiaryAutofill.iss BUILD_WINDOWS_INSTALLER.bat version_info.txt
          git commit -m "Version Desktop rebind release as 1.4.7"
          git push
