name: Temporary 1.4.7 release metadata migration

on:
  push:
    branches: [release/1.4.7-desktop-rebind]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Synchronize 1.4.7 release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text and old not in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one {old!r}, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('pyproject.toml', 'version = "1.4.6"', 'version = "1.4.7"')
          replace_once('main.py', 'APP_VERSION = "v1.4.6-watcher-selfheal"', 'APP_VERSION = "v1.4.7-desktop-rebind"')
          replace_once('prod_audit.py', 'TARGET_VERSION = "1.4.6"', 'TARGET_VERSION = "1.4.7"')
          replace_once('prod_audit.py', 'TARGET_VERSION_LABEL = "v1.4.6-watcher-selfheal"', 'TARGET_VERSION_LABEL = "v1.4.7-desktop-rebind"')
          replace_once('README.md', '**Версия:** `v1.4.6-watcher-selfheal`', '**Версия:** `v1.4.7-desktop-rebind`')
          replace_once('installer/MedicalDiaryAutofill.iss', '#define MyAppVersion "1.4.6"', '#define MyAppVersion "1.4.7"')

          p = Path('BUILD_WINDOWS_INSTALLER.bat')
          text = p.read_text(encoding='utf-8')
          if '1.4.7' not in text:
              if '1.4.6' not in text:
                  raise SystemExit('BUILD_WINDOWS_INSTALLER.bat: 1.4.6 token not found')
              text = text.replace('1.4.6', '1.4.7')
              p.write_text(text, encoding='utf-8')

          p = Path('version_info.txt')
          text = p.read_text(encoding='utf-8')
          if 'v1.4.7-desktop-rebind' not in text:
              if text.count('(1, 4, 6, 0)') != 2:
                  raise SystemExit('version_info.txt: expected two 1.4.6 tuples')
              text = text.replace('(1, 4, 6, 0)', '(1, 4, 7, 0)')
              text = text.replace('v1.4.6-watcher-selfheal', 'v1.4.7-desktop-rebind')
              p.write_text(text, encoding='utf-8')

          notes = Path('RELEASE_NOTES.md')
          text = notes.read_text(encoding='utf-8')
          marker = '# Release notes — v1.4.6-watcher-selfheal\n\n'
          if not text.startswith('# Release notes — v1.4.7-desktop-rebind'):
              if not text.startswith(marker):
                  raise SystemExit('RELEASE_NOTES.md: top marker not found')
              section = '''# Release notes — v1.4.7-desktop-rebind\n\n## v1.4.7-desktop-rebind\n\n- Hidden Windows watcher теперь заново определяет актуальный Desktop в каждом цикле и автоматически переключается на новый `Выписанные пациенты`, если OneDrive или `User Shell Folders` перенесли рабочий стол уже после запуска программы.\n- Уже открытый GUI использует тот же динамический rebind и не остаётся привязанным к старой папке, даже если прежний Desktop-каталог физически продолжает существовать.\n- Сохранено восстановление удалённой папки `Выписанные пациенты`; удаление каталога и перенос самого Desktop теперь покрыты разными regression-contract сценариями.\n- Механика генерации документов не изменялась; document-mechanics guard, полный patient replay и golden DOCX regression остаются обязательными.\n- Версия EXE, installer metadata, package metadata и CI-артефакта синхронизирована как `1.4.7` / `v1.4.7-desktop-rebind`.\n\n## v1.4.6-watcher-selfheal\n\n'''
              text = section + text[len(marker + '## v1.4.6-watcher-selfheal\n\n'):] if text.startswith(marker + '## v1.4.6-watcher-selfheal\n\n') else section + text[len(marker):]
              notes.write_text(text, encoding='utf-8')
          PY
          python prod_audit.py
          python release_check.py
          git diff --check
          if git diff --quiet; then
            echo "1.4.7 metadata already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml main.py prod_audit.py README.md RELEASE_NOTES.md installer/MedicalDiaryAutofill.iss BUILD_WINDOWS_INSTALLER.bat version_info.txt
          git commit -m "Version Desktop rebind release as 1.4.7"
          git push
