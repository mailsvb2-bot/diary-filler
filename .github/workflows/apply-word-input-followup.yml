name: Apply Word input follow-up

on:
  push:
    branches:
      - fix/word-primary-doc-docx-docm
    paths:
      - tools/.word-input-followup.patch
      - .github/workflows/apply-word-input-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/word-primary-doc-docx-docm
          fetch-depth: 0
      - name: Apply exact follow-up patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/.word-input-followup.patch
          git apply tools/.word-input-followup.patch
          rm tools/.word-input-followup.patch
          rm .github/workflows/apply-word-input-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: materialize legacy doc once for canonical parser'
          git push origin HEAD:fix/word-primary-doc-docx-docm
